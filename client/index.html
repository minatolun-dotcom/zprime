<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>zprime</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // R-79: apply the stored theme BEFORE first paint (no flash of the
      // wrong theme). Same key/contract as client/src/lib/theme.ts.
      try {
        var t = localStorage.getItem("zprime_theme");
        if (t === "dark" || t === "warm") document.documentElement.classList.add(t);
      } catch (e) { /* storage unavailable */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
