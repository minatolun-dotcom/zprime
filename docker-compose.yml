services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zprime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zprime}
      POSTGRES_DB: zprime
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zprime"]
      interval: 3s
      timeout: 3s
      retries: 15
    # R-16 (F-R1): self-healing deployment — bring the stack back after host
    # reboots or transient failures without operator intervention.
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://zprime:${POSTGRES_PASSWORD:-zprime}@db:5432/zprime
      # R-09 (B-08): required — the app also fails fast in-process if these are
      # missing/insecure. Create .env first (cp .env.example .env).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (cp .env.example .env)}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (cp .env.example .env)}
      # R-28: OPTIONAL — only needed when an operator configures IRP/EWB
      # credentials (opt-in connectivity). Absent/empty behaves as unset; the
      # server fails fast with an actionable message at first credential save,
      # and refuses to boot if encrypted rows exist and the key is wrong.
      IRP_ENC_KEY: ${IRP_ENC_KEY:-}
      PORT: "3000"
    # R-29: extra_hosts makes the HOST's loopback reachable from the container
    # as `host.docker.internal` — how an operator (or the test suites) points
    # an endpoint override at a locally-hosted mock/test IRP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # R-16 (F-R1): the db healthcheck can pass transiently during a fresh
    # volume's initdb; if the app's first migration connection then hits
    # ECONNREFUSED, the container self-restarts instead of staying dead.
    restart: unless-stopped

  # R-29: test-profile sidecar — the wire-faithful mock IRP, reachable from the
  # app container as http://mock-irp:3199. Never started by `docker compose up`:
  # only `docker compose --profile test up mock-irp`. Suites save that URL as
  # the company's endpoint override (discovering the self-generated public key
  # via /__pubkey), exercising the full handshake inside the compose network —
  # no host-firewall dependency.
  mock-irp:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "scripts/mock_irp.js", "--port", "3199"]
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "3299:3199"   # host 3299 ≠ suite-spawned mocks (3199) — no port collision
    profiles: ["test"]
    restart: unless-stopped

volumes:
  pgdata:
