services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zprime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zprime}
      POSTGRES_DB: zprime
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zprime"]
      interval: 3s
      timeout: 3s
      retries: 15
    # R-16 (F-R1): self-healing deployment — bring the stack back after host
    # reboots or transient failures without operator intervention.
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://zprime:${POSTGRES_PASSWORD:-zprime}@db:5432/zprime
      # R-09 (B-08): required — the app also fails fast in-process if these are
      # missing/insecure. Create .env first (cp .env.example .env).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (cp .env.example .env)}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (cp .env.example .env)}
      # R-28: OPTIONAL — only needed when an operator configures IRP/EWB
      # credentials (opt-in connectivity). Absent/empty behaves as unset; the
      # server fails fast with an actionable message at first credential save,
      # and refuses to boot if encrypted rows exist and the key is wrong.
      IRP_ENC_KEY: ${IRP_ENC_KEY:-}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # R-16 (F-R1): the db healthcheck can pass transiently during a fresh
    # volume's initdb; if the app's first migration connection then hits
    # ECONNREFUSED, the container self-restarts instead of staying dead.
    restart: unless-stopped

volumes:
  pgdata:
